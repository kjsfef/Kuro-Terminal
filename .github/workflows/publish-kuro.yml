name: Publish Kuro Update

on:
  workflow_dispatch:
    inputs:
      version:
        description: "New version, for example 1.1.3"
        required: true
        type: string
      notes:
        description: "What changed in this update"
        required: false
        default: "Kuro update"
        type: string

permissions:
  contents: write

concurrency:
  group: kuro-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - name: Checkout Kuro
        uses: actions/checkout@v4

      - name: Validate version
        shell: pwsh
        run: |
          $version = "${{ inputs.version }}"
          if ($version -notmatch '^\d+\.\d+\.\d+([\-+][0-9A-Za-z\.-]+)?$') {
            throw "Invalid version '$version'. Use a version such as 1.1.3."
          }
          Write-Host "Publishing Kuro $version"

      - name: Install .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore Kuro
        run: dotnet restore Kuro/Kuro.csproj

      - name: Publish Kuro
        shell: pwsh
        run: |
          $version = "${{ inputs.version }}"
          $repoUrl = "https://github.com/${{ github.repository }}"

          dotnet publish Kuro/Kuro.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --output publish `
            -p:Version=$version `
            -p:FileVersion=$version.0 `
            -p:AssemblyVersion=$version.0 `
            -p:KuroRepositoryUrl=$repoUrl `
            -p:DebugType=None `
            -p:DebugSymbols=false

      - name: Create release notes
        shell: pwsh
        run: |
          $version = "${{ inputs.version }}"
          $notes = @'
          ${{ inputs.notes }}
          '@

          @"
          # Kuro $version

          $notes
          "@ | Set-Content -Path release-notes.md -Encoding utf8

      - name: Install Velopack CLI
        run: dotnet tool install --global vpk --version 1.2.0

      - name: Download previous Velopack release
        continue-on-error: true
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          vpk download github `
            --repoUrl "https://github.com/${{ github.repository }}" `
            --token "$env:GITHUB_TOKEN" `
            --outputDir Releases

      - name: Build installer and update packages
        shell: pwsh
        run: |
          vpk pack `
            --packId "KuroTerminal" `
            --packVersion "${{ inputs.version }}" `
            --packDir publish `
            --mainExe "Kuro.exe" `
            --packTitle "Kuro Terminal" `
            --packAuthors "Lthest" `
            --icon "Kuro/Assets/Kuro.ico" `
            --releaseNotes "release-notes.md" `
            --outputDir Releases `
            --noPortable true

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          vpk upload github `
            --repoUrl "https://github.com/${{ github.repository }}" `
            --token "$env:GITHUB_TOKEN" `
            --outputDir Releases `
            --publish true `
            --releaseName "Kuro ${{ inputs.version }}" `
            --tag "v${{ inputs.version }}" `
            --targetCommitish "${{ github.sha }}"
